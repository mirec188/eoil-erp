actor: WebTester
extensions:
  enabled:
    - Codeception\Extension\RunProcess:
        # Main app: test env, synthetic fixture catalog.
        0: env APP_ENV=test APP_DEBUG=false CATALOG_SOURCE=fixture php -S 127.0.0.1:8081 -t public public/index.php
        # Mock eOil (authorize page, token endpoint, catalog API), loopback only. Not a real eOil.
        1: env PHP_CLI_SERVER_WORKERS=2 php -S 127.0.0.1:8092 tests/Support/MockCatalogApi/router.php
        # Same app reading the catalog from the mock eOil, with sign-in through the mock (synthetic secret).
        2: env APP_ENV=test APP_DEBUG=false CATALOG_SOURCE=http EOIL_API_BASE_URL=http://127.0.0.1:8092 EOIL_AUTHORIZE_URL=http://127.0.0.1:8092/erp-auth/authorize EOIL_CLIENT_ID=eoil-erp EOIL_CLIENT_SECRET=synthetic-client-secret-7f3a-not-a-real-secret ERP_REDIRECT_URI=http://127.0.0.1:8082/auth/callback CATALOG_API_TIMEOUT=1 php -S 127.0.0.1:8082 -t public public/index.php
        # Production configuration with the fixture catalog must refuse access.
        3: env APP_ENV=prod APP_DEBUG=false CATALOG_SOURCE=fixture php -S 127.0.0.1:8083 -t public public/index.php
        sleep: 2
modules:
  enabled:
    - PhpBrowser:
        url: http://127.0.0.1:8081
    - Asserts
    - App\Tests\Support\Helper\HttpResponse
